name: validate

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  agents:
    name: SOUL-манифесты и сборка профилей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Валидация SOUL-манифестов
        run: python3 scripts/validate_agents.py

      - name: Тесты скриптов сборки и валидации
        run: python3 tests/test_scripts.py

      - name: Сборка дистрибутивов профилей
        run: python3 scripts/build_profiles.py --clean

      - name: Проверка формы dist (без hermes CLI)
        run: python3 scripts/check_dist.py

      # Файл для внешней проверки называет коммит и хеши файлов; он обязан
      # воспроизводиться из дерева, иначе проверяющий сверяет архив с устаревшими
      # числами (в vector-health рукописный вариант разошёлся именно так).
      # Та же проверка сверяет docs/SHA256SUMS — по нему проверяющий гоняет
      # `sha256sum -c`, поэтому рассинхрон хешей обязан валить сборку.
      - name: docs/for-review.md и docs/SHA256SUMS собраны из текущего дерева
        run: python3 scripts/build_for_review.py --check

      - uses: actions/upload-artifact@v4
        with:
          name: profile-distributions
          path: dist/
          retention-days: 7
